services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: placement_portal
      MYSQL_USER: placement_user
      MYSQL_PASSWORD: placement_password
      MYSQL_ROOT_PASSWORD: root_password
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10
  ai-service:
    build: ./ai-service
    environment: ["PORT=8000"]
    ports: ["8000:8000"]
    volumes: ["./ai-service/trained_models:/app/trained_models"]
  backend:
    build: ./backend
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_USER: placement_user
      DB_PASSWORD: placement_password
      DB_NAME: placement_portal
      DB_PORT: 3306
      JWT_SECRET: change-me-in-production
      AI_SERVICE_URL: http://ai-service:8000
      FRONTEND_URL: http://localhost:5173
    ports: ["5000:5000"]
    depends_on:
      mysql: { condition: service_healthy }
      ai-service: { condition: service_started }
  frontend:
    build: ./frontend
    environment: ["VITE_API_URL=http://localhost:5000/api"]
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  mysql_data:
